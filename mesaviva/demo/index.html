<style>
:root {
  color-scheme: dark;
  --bg: #07080c;
  --bg-2: #0a0c12;
  --surface: #0f121c;
  --surface-2: #151927;
  --surface-3: #1c2132;
  --cell: #0b0d14;
  --line: rgba(255, 255, 255, 0.08);
  --line-2: rgba(255, 255, 255, 0.14);
  --ink: #f4f1ea;
  --ink-2: #bdb8ae;
  --ink-3: #8f8b83;
  --brasa: #ff5500;
  --brasa-2: #f97316;
  --brasa-ink: #ff8a4c;
  --ambar: #ffb800;
  --ambar-2: #f59e0b;
  --esmeralda: #10b981;
  --esmeralda-ink: #34d399;
  --cian: #06b6d4;
  --purpura: #8b5cf6;
  --purpura-ink: #b39dff;
  --danger: #f87171;
  --font-num: "Space Grotesk Variable", "Space Grotesk", system-ui, sans-serif;
  --font-text: "Plus Jakarta Sans Variable", "Plus Jakarta Sans", system-ui, sans-serif;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --wheel-ease: cubic-bezier(0.12, 0.88, 0.18, 1);
  --simbar-h: 104px;
  --r-sm: 8px;
  --r-md: 14px;
  --r-lg: 22px;
  --shadow-float: 0 18px 40px -18px rgba(0, 0, 0, 0.8), 0 2px 6px rgba(0, 0, 0, 0.4);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-text);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100dvh;
  overflow-x: hidden;
}

::selection {
  background: rgba(255, 85, 0, 0.45);
  color: #fff;
}

* {
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-thumb {
  background: rgba(255, 255, 255, 0.14);
  border-radius: 8px;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.45;
}

:focus-visible {
  outline: 2px solid var(--brasa-2);
  outline-offset: 2px;
  border-radius: 6px;
}

input,
textarea {
  caret-color: var(--brasa-2);
}

.num {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.icon {
  width: 18px;
  height: 18px;
  flex: none;
  stroke-width: 1.8;
}

.icon-sm {
  width: 15px;
  height: 15px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

/* ---------- Simulation bar ---------- */

.simbar {
  position: sticky;
  top: 0;
  z-index: 60;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  padding: 10px 16px;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas:
    "brand chip view"
    "who who flags";
  gap: 8px 10px;
  align-items: center;
}

.simbar-brand {
  grid-area: brand;
  display: flex;
  align-items: baseline;
  gap: 6px;
  white-space: nowrap;
}

.simbar-brand strong {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.02em;
}

.simbar-brand span {
  color: var(--ink-3);
  font-size: 12px;
}

.chip-nfc {
  grid-area: chip;
  justify-self: start;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 4px 12px 4px 8px;
  border-radius: 999px;
  border: 1px solid rgba(255, 85, 0, 0.4);
  background: rgba(255, 85, 0, 0.08);
  color: var(--brasa-ink);
  font-size: 12.5px;
  white-space: nowrap;
}

.chip-nfc .num {
  color: var(--ink);
}

.chip-nfc:hover {
  background: rgba(255, 85, 0, 0.16);
}

.chip-dot {
  position: relative;
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  color: var(--brasa);
}

.chip-dot::before,
.chip-dot::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 1.5px solid var(--brasa);
  opacity: 0;
  animation: radar 2.4s var(--ease-out) infinite;
}

.chip-dot::after {
  animation-delay: 1.2s;
}

@keyframes radar {
  0% {
    transform: scale(0.4);
    opacity: 0.9;
  }
  100% {
    transform: scale(1.6);
    opacity: 0;
  }
}

.seg {
  display: inline-flex;
  padding: 3px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  gap: 2px;
}

.seg button {
  min-height: 34px;
  padding: 0 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}

.seg button[aria-pressed="true"] {
  background: var(--surface-3);
  color: var(--ink);
  box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset;
}

.seg-view {
  grid-area: view;
  justify-self: end;
}

@media (max-width: 599px) {
  .simbar {
    padding: 8px 12px;
  }
  .simbar-brand span,
  .chip-nfc .chip-q,
  .seg-view .label {
    display: none;
  }
  .chip-nfc {
    min-width: 0;
    overflow: hidden;
  }
  .who .seg button {
    padding: 0 10px;
  }
  .seg-view button {
    padding: 0 10px;
  }
  .flags .toggle {
    padding-right: 8px;
  }
}

.seg-view button[aria-pressed="true"] {
  background: var(--brasa);
  color: #160800;
}

.who {
  grid-area: who;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  overflow-x: auto;
  scrollbar-width: none;
}

.who > span {
  color: var(--ink-3);
  font-size: 12px;
  white-space: nowrap;
}

.flags {
  grid-area: flags;
  display: flex;
  gap: 8px;
  align-items: center;
}

.toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 0 10px 0 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-2);
  white-space: nowrap;
}

.toggle .knob {
  width: 30px;
  height: 18px;
  border-radius: 99px;
  background: var(--surface-3);
  position: relative;
  transition: background 0.25s var(--ease-out);
}

.toggle .knob::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--ink-2);
  transition:
    transform 0.25s var(--ease-out),
    background 0.25s;
}

.toggle[aria-checked="true"] {
  color: var(--ink);
  border-color: rgba(139, 92, 246, 0.5);
}

.toggle[aria-checked="true"] .knob {
  background: var(--purpura);
}

.toggle[aria-checked="true"] .knob::after {
  transform: translateX(12px);
  background: #fff;
}

.icon-btn {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--line);
  color: var(--ink-2);
}

.icon-btn:hover {
  color: var(--ink);
  border-color: var(--line-2);
}

@media (min-width: 900px) {
  .simbar {
    grid-template-columns: auto auto minmax(0, 1fr) auto auto;
    grid-template-areas: "brand chip who flags view";
    padding: 10px 24px;
  }
  .who {
    justify-content: center;
  }
}

/* ---------- Stage ---------- */

.stage {
  display: grid;
  justify-content: center;
  gap: 28px;
  padding: 0;
}

.phone {
  --phone-h: calc(100dvh - var(--simbar-h));
  width: 100%;
  height: var(--phone-h);
  display: flex;
  flex-direction: column;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

@media (min-width: 600px) {
  .stage {
    padding: 24px 16px 40px;
  }
  .phone {
    --phone-h: min(880px, calc(100dvh - var(--simbar-h) - 48px));
    width: 410px;
    border-radius: 40px;
    border: 1px solid var(--line-2);
    box-shadow:
      0 0 0 8px #050609,
      0 0 0 9px var(--line),
      0 40px 80px -30px rgba(0, 0, 0, 0.9);
  }
}

@media (min-width: 1100px) {
  .stage {
    grid-template-columns: 410px minmax(0, 520px);
    align-items: start;
  }
}

.phone-scroll {
  flex: 1;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding-bottom: 96px;
  scroll-padding-top: 12px;
}

/* ---------- Score bug ---------- */

.bug {
  position: relative;
  z-index: 5;
  margin: 10px 10px 0;
  padding: 10px 12px 12px;
  border-radius: var(--r-md);
  background: rgba(15, 18, 28, 0.72);
  backdrop-filter: blur(16px) saturate(1.2);
  -webkit-backdrop-filter: blur(16px) saturate(1.2);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow-float);
}

.bug-top {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-2);
}

.crest {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  background: var(--brasa);
  color: #1a0900;
  font-family: var(--font-num);
  font-weight: 700;
  font-size: 13px;
  letter-spacing: -0.04em;
}

.bug-title {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
  min-width: 0;
}

.bug-title strong {
  color: var(--ink);
  font-family: var(--font-num);
  font-size: 14px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  white-space: nowrap;
}

.bug-title span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.live {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-num);
  font-weight: 600;
  color: var(--ink);
}

.live::before {
  content: "";
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--esmeralda);
  box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
  animation: pulse 2s infinite;
}

.live.closed::before {
  background: var(--ink-3);
  animation: none;
}

@keyframes pulse {
  70% {
    box-shadow: 0 0 0 7px rgba(16, 185, 129, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
  }
}

.score {
  margin-top: 10px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  align-items: end;
}

.score-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 4px;
}

.score-paid {
  text-align: right;
}

.progress {
  margin-top: 10px;
  height: 6px;
  border-radius: 99px;
  background: var(--cell);
  overflow: hidden;
  border: 1px solid var(--line);
}

.progress > i {
  display: block;
  height: 100%;
  width: var(--p, 0%);
  background: var(--esmeralda);
  border-radius: inherit;
  transition: width 0.8s var(--ease-out);
}

.progress.ambar > i {
  background: linear-gradient(90deg, var(--ambar-2), var(--ambar));
}

.progress.purpura > i {
  background: var(--purpura);
}

/* split-flap numerals */
.flaps {
  display: inline-flex;
  gap: 2px;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  perspective: 300px;
}

.flaps .ch {
  position: relative;
  display: inline-grid;
  place-items: center;
  min-width: 0.66em;
  padding: 0.06em 0.05em;
  border-radius: 3px;
  background:
    radial-gradient(rgba(255, 255, 255, 0.06) 0.8px, transparent 1.1px) 0 0 / 3px 3px,
    var(--cell);
  border: 1px solid rgba(255, 255, 255, 0.05);
  line-height: 1.05;
  transform-origin: 50% 50%;
}

.flaps .ch::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 1px;
  background: rgba(0, 0, 0, 0.7);
}

.flaps .ch.sep {
  min-width: auto;
  background: none;
  border-color: transparent;
  padding-inline: 0;
}

.flaps .ch.sep::after {
  display: none;
}

.flaps .ch.flip {
  animation: flip 0.42s var(--ease-out) both;
  animation-delay: calc(var(--i, 0) * 28ms);
}

@keyframes flip {
  0% {
    transform: rotateX(90deg);
    filter: brightness(1.8);
  }
  60% {
    filter: brightness(1.2);
  }
  100% {
    transform: rotateX(0);
    filter: none;
  }
}

.flaps.xl {
  font-size: 28px;
}

.flaps.lg {
  font-size: 22px;
}

.flaps.md {
  font-size: 17px;
}

.flaps.paid .ch {
  color: var(--esmeralda-ink);
}

/* ---------- Lineup ---------- */

.section {
  padding: 16px 14px 4px;
}

.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin: 0 2px 10px;
}

.section-head h2,
.section-head h3 {
  margin: 0;
  font-family: var(--font-num);
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.section-head p {
  margin: 0;
  color: var(--ink-3);
  font-size: 12.5px;
}

.lineup {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 2px 6px;
  scrollbar-width: none;
}

.player {
  flex: none;
  width: 92px;
  padding: 10px 8px 9px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
  text-align: left;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: relative;
}

.player[aria-current="true"] {
  border-color: rgba(255, 85, 0, 0.55);
  background: linear-gradient(180deg, rgba(255, 85, 0, 0.1), rgba(255, 85, 0, 0) 60%), var(--surface);
}

.dorsal {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: 22px;
  line-height: 1;
  letter-spacing: -0.04em;
  color: var(--ink);
}

.player .name {
  font-size: 13px;
  font-weight: 600;
}

.player .sub {
  font-family: var(--font-num);
  font-size: 13px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  width: fit-content;
  padding: 2px 7px;
  border-radius: 99px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 1px solid var(--line-2);
  color: var(--ink-2);
}

.badge.paid {
  color: var(--esmeralda-ink);
  border-color: rgba(16, 185, 129, 0.45);
  background: rgba(16, 185, 129, 0.1);
}

.badge.wait {
  color: var(--ambar);
  border-color: rgba(255, 184, 0, 0.4);
  background: rgba(255, 184, 0, 0.08);
}

.badge.fire {
  color: var(--brasa-ink);
  border-color: rgba(255, 85, 0, 0.45);
  background: rgba(255, 85, 0, 0.08);
}

.badge.sim {
  color: var(--ink-3);
  border-style: dashed;
}

.badge.soon {
  color: var(--cian);
  border-color: rgba(6, 182, 212, 0.4);
}

.player.add {
  justify-content: center;
  align-items: center;
  color: var(--ink-2);
  border-style: dashed;
  text-align: center;
  font-size: 12.5px;
  font-weight: 600;
}

.service {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

.service .btn {
  font-size: 13.5px;
  line-height: 1.2;
}

.btn {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 12px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 650;
  font-size: 14px;
  border: 1px solid var(--line-2);
  background: var(--surface);
  color: var(--ink);
  transition:
    transform 0.15s var(--ease-out),
    background 0.2s;
  text-align: center;
}

.btn:active:not(:disabled) {
  transform: scale(0.97);
}

.btn:hover:not(:disabled) {
  background: var(--surface-2);
}

.btn.primary {
  background: var(--brasa);
  border-color: transparent;
  color: #170800;
}

.btn.primary:hover:not(:disabled) {
  background: var(--brasa-2);
}

.btn.paid {
  background: var(--esmeralda);
  border-color: transparent;
  color: #021a11;
}

.btn.ambar {
  border-color: rgba(255, 184, 0, 0.45);
  color: var(--ambar);
}

.btn.ghost {
  background: transparent;
}

.btn.sm {
  min-height: 36px;
  font-size: 13px;
  padding: 0 11px;
  border-radius: 10px;
}

.btn.block {
  width: 100%;
}

.goal {
  margin-top: 12px;
  padding: 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
}

.goal-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: 13px;
}

.goal-row strong {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

.goal .note {
  margin: 6px 0 0;
  font-size: 12.5px;
  color: var(--ink-2);
}

.goal .note b {
  color: var(--ambar);
}

.goal.unlocked .note b {
  color: var(--purpura-ink);
}

/* ---------- Tabs ---------- */

.tabbar {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 10px;
  z-index: 8;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  padding: 6px;
  border-radius: 20px;
  background: rgba(15, 18, 28, 0.82);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow-float);
}

.tabbar button {
  min-height: 52px;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--ink-3);
  position: relative;
}

.tabbar button[aria-selected="true"] {
  color: var(--ink);
  background: var(--surface-3);
}

.tabbar button[aria-selected="true"] .icon {
  color: var(--brasa-2);
}

.tabbar .count {
  position: absolute;
  top: 5px;
  right: calc(50% - 22px);
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 99px;
  background: var(--brasa);
  color: #170800;
  font-family: var(--font-num);
  font-size: 11px;
  font-weight: 700;
  display: grid;
  place-items: center;
}

/* ---------- Menu ---------- */

.menu-tools {
  position: sticky;
  top: 0;
  z-index: 3;
  padding: 10px 14px 8px;
  background: linear-gradient(180deg, var(--bg) 78%, rgba(7, 8, 12, 0));
}

.search {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 12px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--ink-3);
}

.search input {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  color: var(--ink);
}

.search input::placeholder {
  color: var(--ink-3);
}

.cats {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 10px 0 2px;
  scrollbar-width: none;
}

.cats button {
  flex: none;
  min-height: 34px;
  padding: 0 12px;
  border-radius: 99px;
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-2);
  white-space: nowrap;
}

.cats button[aria-pressed="true"] {
  border-color: var(--brasa);
  color: var(--ink);
  background: rgba(255, 85, 0, 0.12);
}

.cat-title {
  margin: 18px 16px 6px;
  font-family: var(--font-num);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.dish {
  margin: 0 10px;
  padding: 14px 6px 14px;
  border-bottom: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 12px;
}

.dish-name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 15.5px;
  line-height: 1.25;
}

.dish-desc {
  grid-column: 1 / -1;
  margin: 0;
  color: var(--ink-2);
  font-size: 13px;
  line-height: 1.45;
}

.dish-price {
  font-family: var(--font-num);
  font-weight: 600;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  text-align: right;
}

.dish-price small {
  display: block;
  font-family: var(--font-text);
  color: var(--ink-3);
  font-size: 11.5px;
  font-weight: 500;
}

.dish-actions {
  grid-column: 1 / -1;
  display: flex;
  gap: 8px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.steam {
  position: relative;
  width: 16px;
  height: 18px;
  color: var(--brasa-2);
  flex: none;
}

.steam i {
  position: absolute;
  bottom: 2px;
  width: 3px;
  height: 12px;
  border-radius: 99px;
  background: linear-gradient(180deg, rgba(255, 214, 180, 0), rgba(255, 214, 180, 0.85));
  filter: blur(0.6px);
  animation: steam-rise 2.6s ease-in-out infinite;
  opacity: 0;
}

.steam i:nth-child(1) {
  left: 2px;
}

.steam i:nth-child(2) {
  left: 7px;
  animation-delay: 0.8s;
}

.steam i:nth-child(3) {
  left: 12px;
  animation-delay: 1.6s;
}

@keyframes steam-rise {
  0% {
    transform: translateY(4px) scaleY(0.6);
    opacity: 0;
  }
  35% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-9px) translateX(1px) scaleY(1.2);
    opacity: 0;
  }
}

.empty {
  margin: 28px 20px;
  padding: 20px;
  border-radius: var(--r-md);
  border: 1px dashed var(--line-2);
  color: var(--ink-2);
  text-align: center;
  font-size: 14px;
}

/* ---------- Order (Mesa) ---------- */

.item {
  margin: 0 10px 10px;
  padding: 12px;
  border-radius: var(--r-md);
  background: var(--surface);
  border: 1px solid var(--line);
}

.item-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.item-head strong {
  font-size: 14.5px;
}

.item-meta {
  font-size: 12.5px;
  color: var(--ink-2);
  margin-top: 2px;
}

.item-split {
  margin-top: 6px;
  font-family: var(--font-num);
  font-size: 13px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.pills {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

.pill {
  min-height: 34px;
  padding: 0 11px;
  border-radius: 99px;
  border: 1px solid var(--line-2);
  font-size: 12.5px;
  font-weight: 650;
  color: var(--ink-2);
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.pill[aria-pressed="true"] {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}

.pill .num {
  font-weight: 700;
}

.totals {
  margin: 6px 10px 12px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
}

.totals-row {
  display: flex;
  justify-content: space-between;
  padding: 5px 0;
  font-size: 14px;
  background: var(--surface);
}

.totals-row span:last-child {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

.totals-row.big {
  font-weight: 700;
  font-size: 16px;
  border-top: 1px solid var(--line);
  margin-top: 4px;
  padding-top: 9px;
}

.totals-row.discount span:last-child {
  color: var(--purpura-ink);
}

.tips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}

.tip-input {
  width: 112px;
  min-height: 36px;
  padding: 0 10px;
  border-radius: 10px;
  border: 1px solid var(--line-2);
  background: var(--cell);
  font-family: var(--font-num);
}

.hint {
  margin: 8px 2px 0;
  color: var(--ink-3);
  font-size: 12px;
}

.shares {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin: 0 10px;
}

.share {
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.share b {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

/* ---------- Wheels ---------- */

.wheel-card {
  margin: 0 10px 14px;
  padding: 14px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
}

.wheel-card.locked {
  opacity: 0.92;
}

.wheel-wrap {
  position: relative;
  width: min(260px, 72vw);
  aspect-ratio: 1;
  margin: 14px auto 10px;
}

.wheel {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 4px solid #1e2335;
  box-shadow:
    0 0 0 1px var(--line-2),
    0 20px 40px -18px rgba(0, 0, 0, 0.9) inset,
    0 18px 36px -20px rgba(0, 0, 0, 0.9);
  overflow: hidden;
}

.wheel-face {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  will-change: transform;
}

.wheel-label {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 46%;
  margin-top: -9px;
  transform-origin: 0 50%;
  text-align: right;
  padding-right: 12px;
  font-family: var(--font-num);
  font-weight: 700;
  font-size: 13px;
  color: #11131b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.wheel-hub {
  position: absolute;
  inset: 39%;
  border-radius: 50%;
  background: var(--bg-2);
  border: 1px solid var(--line-2);
  display: grid;
  place-items: center;
  text-align: center;
  font-family: var(--font-num);
  font-weight: 700;
  font-size: 12px;
  line-height: 1.1;
  color: var(--ink);
  z-index: 2;
}

.wheel-pointer {
  position: absolute;
  top: -12px;
  left: 50%;
  margin-left: -11px;
  width: 22px;
  height: 26px;
  z-index: 3;
  color: var(--ink);
  filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.6));
}

.modes {
  display: grid;
  gap: 8px;
  margin-top: 12px;
}

.mode {
  text-align: left;
  padding: 11px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  display: grid;
  gap: 2px;
}

.mode strong {
  font-size: 14px;
}

.mode span {
  font-size: 12.5px;
  color: var(--ink-2);
}

.mode[aria-pressed="true"] {
  border-color: var(--ambar);
  background: rgba(255, 184, 0, 0.07);
}

.result {
  margin-top: 12px;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid rgba(255, 184, 0, 0.4);
  background: rgba(255, 184, 0, 0.06);
  font-size: 14px;
}

.result.prize {
  border-color: rgba(139, 92, 246, 0.45);
  background: rgba(139, 92, 246, 0.08);
}

.field {
  display: grid;
  gap: 6px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--ink-2);
}

.field input,
.field textarea,
.field select {
  min-height: 44px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--line-2);
  background: var(--cell);
  color: var(--ink);
}

.field textarea {
  min-height: 72px;
  resize: vertical;
}

.check {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  margin-top: 10px;
  font-size: 12.5px;
  color: var(--ink-2);
}

.check input {
  margin-top: 3px;
  width: 18px;
  height: 18px;
  accent-color: var(--brasa);
}

/* ---------- Payments ---------- */

.board {
  margin: 0 10px 12px;
  padding: 14px;
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background:
    radial-gradient(
      circle at 50% 50%,
      transparent 38px,
      var(--line) 38.5px,
      var(--line) 39.5px,
      transparent 40px
    ),
    linear-gradient(
      90deg,
      transparent calc(50% - 0.5px),
      var(--line) calc(50% - 0.5px),
      var(--line) calc(50% + 0.5px),
      transparent calc(50% + 0.5px)
    ),
    var(--surface);
}

.board-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px 10px;
}

.board-grid > div {
  background: var(--surface);
  padding: 2px 4px;
}

.board-grid > div:nth-child(even) {
  text-align: right;
}

.pay {
  margin: 0 10px 10px;
  padding: 12px;
  border-radius: var(--r-md);
  border: 1px solid var(--line);
  background: var(--surface);
}

.pay[aria-current="true"] {
  border-color: rgba(255, 85, 0, 0.5);
}

.pay.done {
  border-color: rgba(16, 185, 129, 0.4);
}

.pay-head {
  display: flex;
  align-items: center;
  gap: 10px;
}

.pay-head .dorsal {
  font-size: 18px;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  background: var(--cell);
  border: 1px solid var(--line);
}

.pay-head .who-name {
  flex: 1;
  min-width: 0;
}

.pay-head .who-name strong {
  display: block;
}

.pay-head .who-name span {
  font-size: 12.5px;
  color: var(--ink-2);
}

.methods {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 10px;
}

.methods .btn {
  min-height: 52px;
  font-size: 12.5px;
  flex-direction: column;
  gap: 3px;
  padding: 6px 4px;
}

.methods .btn.online {
  grid-column: 1 / -1;
  flex-direction: row;
  min-height: 44px;
  font-size: 13.5px;
  background: var(--brasa);
  color: #170800;
  border-color: transparent;
}

.cash-note {
  margin-top: 8px;
  font-size: 12px;
  color: var(--ink-3);
}

/* ---------- Lower thirds ---------- */

.thirds {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 84px;
  z-index: 9;
  display: grid;
  gap: 6px;
  pointer-events: none;
}

.third {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: stretch;
  border-radius: 10px;
  overflow: hidden;
  background: rgba(10, 12, 18, 0.94);
  border: 1px solid var(--line-2);
  box-shadow: var(--shadow-float);
  animation: third-in 0.5s var(--ease-out) both;
}

.third.out {
  animation: third-out 0.35s ease-in both;
}

.third-tag {
  padding: 8px 10px;
  font-family: var(--font-num);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  color: #0b0b0b;
  background: var(--brasa);
}

.third.pay .third-tag {
  background: var(--esmeralda);
}

.third.card .third-tag {
  background: var(--ambar);
}

.third.prize .third-tag {
  background: var(--purpura);
  color: #fff;
}

.third.info .third-tag {
  background: var(--cian);
}

.third.warn .third-tag {
  background: var(--danger);
}

.third-text {
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 600;
}

@keyframes third-in {
  from {
    clip-path: inset(0 100% 0 0);
    transform: translateY(6px);
  }
  to {
    clip-path: inset(0 0 0 0);
    transform: none;
  }
}

@keyframes third-out {
  to {
    clip-path: inset(0 0 0 100%);
    opacity: 0;
  }
}

/* ---------- Sheets & dialogs ---------- */

.scrim {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: rgba(3, 4, 7, 0.66);
  display: grid;
  align-items: end;
  justify-items: center;
  animation: fade 0.2s ease-out both;
}

@media (min-width: 600px) {
  .scrim {
    align-items: center;
  }
}

@keyframes fade {
  from {
    opacity: 0;
  }
}

.sheet {
  width: min(520px, 100%);
  max-height: 92dvh;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--line-2);
  border-radius: 24px 24px 0 0;
  padding: 18px 16px 22px;
  box-shadow: 0 -20px 60px -20px rgba(0, 0, 0, 0.9);
  animation: rise 0.45s var(--ease-out) both;
}

@media (min-width: 600px) {
  .sheet {
    border-radius: 24px;
  }
}

@keyframes rise {
  from {
    transform: translateY(40px);
    opacity: 0;
  }
}

.sheet-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 6px;
}

.sheet-head h2 {
  margin: 0;
  font-family: var(--font-num);
  font-size: 21px;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.sheet-head p {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--ink-2);
}

.sizes {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 6px;
  margin-top: 12px;
}

.size {
  padding: 9px 10px;
  border-radius: 12px;
  border: 1px solid var(--line-2);
  text-align: left;
  display: flex;
  justify-content: space-between;
  gap: 6px;
  font-size: 13px;
}

.size[aria-pressed="true"] {
  border-color: var(--brasa);
  background: rgba(255, 85, 0, 0.1);
}

.size b {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

.extras {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.sub-title {
  margin: 16px 0 0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.sheet-foot {
  position: sticky;
  bottom: -22px;
  margin: 16px -16px -22px;
  padding: 12px 16px 18px;
  background: var(--surface);
  border-top: 1px solid var(--line);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.sheet-foot .total {
  grid-column: 1 / -1;
  display: flex;
  justify-content: space-between;
  font-weight: 700;
  font-size: 15px;
}

.sheet-foot .total span:last-child {
  font-family: var(--font-num);
}

/* studio 360 */
.studio {
  position: relative;
  margin-top: 12px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background:
    radial-gradient(ellipse 60% 40% at 50% 8%, rgba(255, 255, 255, 0.14), transparent 70%),
    radial-gradient(ellipse 70% 22% at 50% 88%, rgba(0, 0, 0, 0.7), transparent 70%), var(--cell);
  padding: 18px 12px 12px;
  touch-action: none;
  user-select: none;
}

.turntable {
  width: min(250px, 66vw);
  aspect-ratio: 1;
  margin: 0 auto;
  border-radius: 50%;
  cursor: grab;
  position: relative;
}

.turntable:active {
  cursor: grabbing;
}

.turntable svg {
  width: 100%;
  height: 100%;
  display: block;
}

.turntable::after {
  content: "";
  position: absolute;
  left: 10%;
  right: 10%;
  bottom: -14px;
  height: 18px;
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(0, 0, 0, 0.7), transparent);
  z-index: -1;
}

.turntable .steam-big {
  position: absolute;
  inset: 10% 30% auto;
  height: 40%;
  pointer-events: none;
}

.turntable .steam-big i {
  position: absolute;
  bottom: 0;
  width: 10px;
  height: 60%;
  border-radius: 99px;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.28));
  filter: blur(3px);
  animation: steam-rise 3.2s ease-in-out infinite;
  opacity: 0;
}

.turntable .steam-big i:nth-child(1) {
  left: 20%;
}

.turntable .steam-big i:nth-child(2) {
  left: 48%;
  animation-delay: 1s;
}

.turntable .steam-big i:nth-child(3) {
  left: 74%;
  animation-delay: 2s;
}

.studio-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
}

.studio-row input[type="range"] {
  flex: 1;
  accent-color: var(--brasa);
}

.angle-tag {
  margin-top: 8px;
  min-height: 40px;
  font-size: 13px;
  color: var(--ink-2);
  text-align: center;
}

.angle-tag b {
  font-family: var(--font-num);
  color: var(--ink);
}

.illus-note {
  position: absolute;
  top: 10px;
  left: 12px;
  font-size: 11px;
  color: var(--ink-3);
}

/* NFC simulator */
.reader {
  position: relative;
  margin: 18px auto 8px;
  width: 180px;
  height: 180px;
  display: grid;
  place-items: center;
}

.reader .acrylic {
  width: 120px;
  height: 120px;
  border-radius: 24px;
  border: 1px solid var(--line-2);
  background:
    linear-gradient(160deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.02) 50%), var(--surface-2);
  display: grid;
  place-items: center;
  text-align: center;
  font-family: var(--font-num);
  font-size: 12px;
  color: var(--ink-2);
  position: relative;
  z-index: 2;
}

.reader .acrylic b {
  display: block;
  font-size: 26px;
  color: var(--ink);
}

.reader .wave {
  position: absolute;
  inset: 20px;
  border-radius: 50%;
  border: 2px solid var(--brasa);
  opacity: 0;
}

.reader.tapping .wave {
  animation: radar-wave 1.1s var(--ease-out) both;
}

.reader.tapping .wave:nth-child(2) {
  animation-delay: 0.15s;
}

.reader.tapping .wave:nth-child(3) {
  animation-delay: 0.3s;
}

@keyframes radar-wave {
  0% {
    transform: scale(0.5);
    opacity: 1;
  }
  100% {
    transform: scale(1.35);
    opacity: 0;
  }
}

.url {
  margin-top: 10px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--cell);
  border: 1px solid var(--line);
  font-family: var(--font-num);
  font-size: 13px;
  word-break: break-all;
}

.url b {
  color: var(--brasa-ink);
}

.log {
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 4px;
  font-size: 12.5px;
}

.log li {
  display: flex;
  gap: 8px;
  align-items: center;
  color: var(--ink-2);
}

.ok {
  color: var(--esmeralda-ink);
}

.bad {
  color: var(--danger);
}

/* ---------- Mirror (desktop live till) ---------- */

.mirror {
  display: none;
}

@media (min-width: 1100px) {
  .mirror {
    display: block;
    position: sticky;
    top: calc(var(--simbar-h) + 24px);
  }
}

.mirror-card {
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 18px;
}

.mirror-card + .mirror-card {
  margin-top: 14px;
}

.mirror h2 {
  margin: 0 0 4px;
  font-family: var(--font-num);
  font-size: 20px;
  letter-spacing: -0.02em;
}

.mirror p.lead {
  margin: 0 0 14px;
  color: var(--ink-2);
  font-size: 14px;
  max-width: 52ch;
}

.feed {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
  max-height: 280px;
  overflow-y: auto;
}

.feed li {
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--cell);
  border: 1px solid var(--line);
  font-size: 13px;
  animation: rise 0.4s var(--ease-out) both;
}

.feed time {
  font-family: var(--font-num);
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}

.feed .k-pay {
  color: var(--esmeralda-ink);
}

.feed .k-card {
  color: var(--ambar);
}

.feed .k-prize {
  color: var(--purpura-ink);
}

.feed .k-dian {
  color: var(--esmeralda-ink);
}

.cta-pascal {
  display: flex;
  gap: 12px;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
}

.cta-pascal p {
  margin: 0;
  color: var(--ink-2);
  font-size: 14px;
  max-width: 40ch;
}

/* ---------- ERP ---------- */

.erp {
  padding: 18px 16px 60px;
  max-width: 1360px;
  margin: 0 auto;
}

.erp-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.erp-head h1 {
  margin: 0;
  font-family: var(--font-num);
  font-size: 26px;
  letter-spacing: -0.02em;
}

.erp-head p {
  margin: 2px 0 0;
  color: var(--ink-2);
  font-size: 13.5px;
}

.erp .bug {
  margin: 0;
  min-width: min(100%, 420px);
}

.erp-tabs {
  display: flex;
  gap: 4px;
  margin: 18px 0 16px;
  overflow-x: auto;
  border-bottom: 1px solid var(--line);
  scrollbar-width: none;
}

.erp-tabs button {
  flex: none;
  min-height: 44px;
  padding: 0 14px;
  font-weight: 650;
  font-size: 14px;
  color: var(--ink-3);
  border-bottom: 2px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
}

.erp-tabs button[aria-selected="true"] {
  color: var(--ink);
  border-bottom-color: var(--brasa);
}

.erp-tabs .count {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 99px;
  background: var(--ambar);
  color: #1a1200;
  font-family: var(--font-num);
  font-size: 11.5px;
  display: inline-grid;
  place-items: center;
}

.erp-grid {
  display: grid;
  gap: 16px;
}

@media (min-width: 960px) {
  .erp-grid {
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    align-items: start;
  }
  .erp-grid.three {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr);
  }
}

.panel {
  border-radius: var(--r-lg);
  border: 1px solid var(--line);
  background: var(--surface);
  padding: 16px;
  min-width: 0;
}

.panel + .panel {
  margin-top: 16px;
}

.panel h2 {
  margin: 0;
  font-family: var(--font-num);
  font-size: 17px;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel .lead {
  margin: 4px 0 12px;
  color: var(--ink-2);
  font-size: 13px;
  max-width: 60ch;
}

.floor {
  display: grid;
  gap: 14px;
}

.zone h3 {
  margin: 0 0 8px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.tables {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
  gap: 8px;
}

.tbl {
  min-height: 84px;
  padding: 10px;
  border-radius: 14px;
  border: 1px solid var(--line);
  background: var(--cell);
  text-align: left;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 4px;
}

.tbl strong {
  font-family: var(--font-num);
  font-size: 18px;
}

.tbl span {
  font-size: 12px;
  color: var(--ink-2);
}

.tbl.busy {
  border-color: rgba(255, 255, 255, 0.2);
}

.tbl.bill {
  border-color: rgba(255, 184, 0, 0.5);
}

.tbl.nfc {
  border-color: var(--brasa);
  background: linear-gradient(160deg, rgba(255, 85, 0, 0.16), rgba(255, 85, 0, 0.02)), var(--cell);
}

.tbl.paid {
  border-color: rgba(16, 185, 129, 0.5);
}

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 12px;
  font-size: 12px;
  color: var(--ink-2);
}

.legend i {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-right: 5px;
  vertical-align: -1px;
  border: 1px solid var(--line-2);
}

.cards-stack {
  display: grid;
  gap: 8px;
}

.alert {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  gap: 10px;
  align-items: center;
  padding: 10px;
  border-radius: 12px;
  background: var(--cell);
  border: 1px solid var(--line);
}

.ycard {
  width: 26px;
  height: 34px;
  border-radius: 4px;
  background: linear-gradient(160deg, var(--ambar), var(--ambar-2));
  box-shadow: 0 6px 12px -6px rgba(255, 184, 0, 0.6);
  transform: rotate(-8deg);
  justify-self: center;
}

.ycard.cian {
  background: var(--cian);
  box-shadow: 0 6px 12px -6px rgba(6, 182, 212, 0.6);
}

.ycard.purpura {
  background: var(--purpura);
  box-shadow: 0 6px 12px -6px rgba(139, 92, 246, 0.6);
}

.alert strong {
  display: block;
  font-size: 14px;
}

.alert span {
  font-size: 12.5px;
  color: var(--ink-2);
}

.table-data {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
}

.table-data th {
  text-align: left;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding: 8px 8px;
  border-bottom: 1px solid var(--line-2);
}

.table-data td {
  padding: 9px 8px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}

.table-data td.r,
.table-data th.r {
  text-align: right;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

.table-data tfoot td {
  font-weight: 700;
  border-bottom: 0;
  border-top: 1px solid var(--line-2);
}

.scroll-x {
  overflow-x: auto;
}

.ticket {
  border-radius: 12px;
  background: #f1ece2;
  color: #1b1712;
  padding: 12px 12px 14px;
  font-size: 13px;
  position: relative;
  box-shadow: 0 10px 20px -12px rgba(0, 0, 0, 0.8);
}

.ticket header {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-num);
  font-weight: 700;
  border-bottom: 1px dashed rgba(0, 0, 0, 0.3);
  padding-bottom: 6px;
  margin-bottom: 6px;
}

.ticket ul {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 4px;
}

.ticket em {
  display: block;
  font-style: normal;
  font-size: 12px;
  color: #6b5d4b;
}

.ticket .btn {
  margin-top: 10px;
  background: #1b1712;
  color: #f1ece2;
  border-color: transparent;
}

.kds {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}

.docs {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}

.doc-list {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  display: grid;
  gap: 8px;
}

.doc-list li {
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--cell);
  display: grid;
  gap: 2px;
  font-size: 13px;
}

.doc-list .row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
}

.doc-list code {
  font-family: var(--font-num);
  font-size: 11.5px;
  color: var(--ink-3);
  word-break: break-all;
}

.status {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  padding: 2px 8px;
  border-radius: 99px;
  border: 1px solid var(--line-2);
  white-space: nowrap;
}

.status.queued {
  color: var(--ambar);
  border-color: rgba(255, 184, 0, 0.4);
}

.status.accepted {
  color: var(--esmeralda-ink);
  border-color: rgba(16, 185, 129, 0.45);
}

.plans {
  display: grid;
  gap: 10px;
}

@media (min-width: 720px) {
  .plans {
    grid-template-columns: repeat(4, 1fr);
  }
}

.plan {
  text-align: left;
  padding: 14px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--cell);
  display: grid;
  gap: 6px;
  align-content: start;
}

.plan[aria-pressed="true"] {
  border-color: var(--brasa);
  background: linear-gradient(170deg, rgba(255, 85, 0, 0.12), rgba(255, 85, 0, 0) 60%), var(--cell);
}

.plan strong {
  font-family: var(--font-num);
  font-size: 18px;
}

.plan .limits {
  font-family: var(--font-num);
  font-size: 13px;
  color: var(--ink-2);
}

.plan ul {
  margin: 4px 0 0;
  padding-left: 16px;
  font-size: 12.5px;
  color: var(--ink-2);
  display: grid;
  gap: 3px;
}

.modes-nfc {
  display: grid;
  gap: 8px;
}

.kv {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 6px 14px;
  font-size: 13.5px;
}

.kv dt {
  color: var(--ink-3);
}

.kv dd {
  margin: 0;
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
}

.recipe {
  list-style: none;
  margin: 8px 0 0;
  padding: 0;
  display: grid;
  gap: 6px;
}

.recipe li {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 10px;
  align-items: center;
  font-size: 13px;
}

.bar {
  width: 90px;
  height: 6px;
  border-radius: 99px;
  background: var(--cell);
  border: 1px solid var(--line);
  overflow: hidden;
}

.bar i {
  display: block;
  height: 100%;
  background: var(--cian);
  width: var(--p);
  transition: width 0.6s var(--ease-out);
}

.bar.low i {
  background: var(--ambar);
}

.steps {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  display: grid;
  gap: 6px;
}

.steps li {
  display: flex;
  gap: 10px;
  align-items: center;
  font-size: 13px;
  color: var(--ink-3);
}

.steps li.done {
  color: var(--ink);
}

.steps li .dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1px solid var(--line-2);
}

.steps li.done .dot {
  background: var(--cian);
  border-color: var(--cian);
}

.footnote {
  margin: 24px auto 0;
  max-width: 1360px;
  padding: 0 16px 40px;
  font-size: 12px;
  color: var(--ink-3);
}

canvas.confetti {
  position: fixed;
  inset: 0;
  z-index: 90;
  pointer-events: none;
}

.goal-flash {
  position: fixed;
  inset: 0;
  z-index: 89;
  pointer-events: none;
  background: radial-gradient(circle at 50% 40%, rgba(16, 185, 129, 0.35), transparent 60%);
  animation: fade 0.2s ease-out reverse both;
  animation-duration: 1.2s;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .steam,
  .steam-big {
    display: none;
  }
}

.erp-thirds {
  position: fixed;
  left: auto;
  right: 16px;
  bottom: 16px;
  width: min(400px, calc(100% - 32px));
  z-index: 70;
}

@media (max-width: 959px) {
  .erp-grid > div:last-child {
    order: -1;
  }
}

.erp-grid > *,
.panel,
.docs > * {
  min-width: 0;
}

.docs .btn {
  white-space: normal;
}

.gol {
  position: fixed;
  inset: 0;
  z-index: 88;
  display: grid;
  place-items: center;
  pointer-events: none;
  background: rgba(3, 4, 7, 0.55);
  animation: fade 0.2s ease-out both;
}

.gol-band {
  width: 100%;
  padding: 22px 16px;
  background: var(--esmeralda);
  color: #021a11;
  display: grid;
  justify-items: center;
  gap: 2px;
  box-shadow: 0 30px 60px -30px rgba(0, 0, 0, 0.9);
  animation: gol-band 2.6s var(--ease-out) both;
}

.gol-band strong {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: clamp(44px, 12vw, 104px);
  line-height: 1;
  letter-spacing: -0.04em;
}

.gol-band span {
  font-family: var(--font-num);
  font-weight: 600;
  font-size: clamp(15px, 2.4vw, 22px);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

@keyframes gol-band {
  0% {
    clip-path: inset(0 50% 0 50%);
  }
  18% {
    clip-path: inset(0 0 0 0);
  }
  82% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}

.btn {
  text-decoration: none;
}

.bug-foot {
  display: flex;
  justify-content: space-between;
  margin-top: 6px;
  font-family: var(--font-num);
  font-size: 12px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}

.service.compact {
  margin-top: 8px;
}

.service.compact .btn {
  min-height: 40px;
  font-size: 13px;
}

.goal {
  margin-top: 8px;
  padding: 9px 12px 10px;
}

.goal .note {
  margin: 0 0 7px;
  font-size: 12.5px;
}

.lineup .player {
  padding: 8px 8px 7px;
  gap: 2px;
}

.lineup .dorsal {
  font-size: 19px;
}

.section {
  padding-top: 12px;
}

.who-short,
.who .who-dorsal {
  display: none;
}

.third-tag {
  white-space: nowrap;
}

@media (min-width: 600px) {
  .phone {
    position: sticky;
    top: calc(var(--simbar-h) + 24px);
  }
}

@media (max-width: 599px) {
  .who {
    overflow: visible;
  }
  .who .who-short {
    display: inline;
  }
  .who .who-long,
  .who .who-name {
    display: none;
  }
  .who .who-dorsal {
    display: inline;
    font-family: var(--font-num);
    font-weight: 700;
  }
  .who .seg button {
    min-width: 38px;
    padding: 0 8px;
    justify-content: center;
  }
}

.cat-title {
  margin-top: 12px;
}

.lineup .badge {
  padding: 1px 6px;
  font-size: 10px;
}

.cat-title {
  margin-top: 6px;
}

.dish {
  padding-top: 10px;
}

.menu-tools {
  padding-top: 6px;
}

.cats {
  padding-top: 8px;
}

@media (max-width: 599px) {
  .who {
    min-width: 0;
  }
  .flags {
    justify-self: end;
  }
}

@media (max-width: 419px) {
  .who .who-short {
    display: none;
  }
  .who .seg button {
    min-width: 34px;
    padding: 0 6px;
  }
  .flags .toggle {
    padding: 0 8px 0 5px;
    gap: 6px;
  }
}

@media (max-width: 339px) {
  .flags .toggle .toggle-text {
    display: none;
  }
}
