<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fanátikos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Demo de Fanátikos de PascalIA: gestión de campeonatos de fútbol aficionado con tabla en vivo, planilla arbitral, actas en PDF e imágenes para redes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800;900&family=Oswald:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: app shell — sticky role bar, banner header, one view per role with scrollable tab rails; everything wraps to one column under 720px. */
:root {
  --bg: #161616;
  --surface: #1F1F1F;
  --surface-2: #2A2A2A;
  --line: rgba(255,255,255,.1);
  --text: #F7F7F7;
  --muted: #B5B5B5;
  --primary: #FFC107;
  --on-primary: #1F1F1F;
  --accent: #4FC3F7;
  --hl: #FFC107;
  --hl-text: #1F1F1F;
  --ok: #3DDC84;
  --warn: #FFB300;
  --danger: #FF5A4F;
  --c-yellow: #FFD600;
  --c-blue: #2196F3;
  --c-red: #E53935;
  --zone-1: #3DDC84;
  --zone-2: #4FC3F7;
  --zone-3: #FF5A4F;
  --radius: 16px;
  --radius-sm: 10px;
  --font-display: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
img { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; line-height: 1.15; text-wrap: balance; }
p { margin: 0; }
.i { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.wrap { max-width: 1200px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.tiny { font-size: .72rem; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 700 .72rem/1.2 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--primary); }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.wrap-ok { flex-wrap: wrap; }
.between { justify-content: space-between; }
.stack { display: grid; gap: 12px; min-width: 0; }
.stack-lg { display: grid; gap: 20px; min-width: 0; }
.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.grid-3 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.grow { flex: 1; min-width: 0; }

/* Role bar */
.rolebar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--surface); border-bottom: 1px solid var(--line); }
.rolebar .wrap { display: flex; align-items: center; gap: 10px; padding-block: 8px; }
.demo-tag { font: 800 .66rem/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; background: var(--primary); color: var(--on-primary); padding: 6px 9px; border-radius: 999px; flex: none; }
.rail { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; flex: 1; scroll-snap-type: x proximity; mask-image: linear-gradient(90deg, #000 92%, transparent); padding-right: 18px; }
.rail::-webkit-scrollbar { display: none; }
.rail > * { scroll-snap-align: start; flex: none; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font: 600 .82rem/1 var(--font-display); cursor: pointer; white-space: nowrap; position: relative; }
.pill:hover { color: var(--text); border-color: color-mix(in srgb, var(--primary) 50%, transparent); }
.pill.on { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.pill .dot { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--danger); color: #fff; font-size: .66rem; display: inline-grid; place-items: center; }

/* Marca PascalIA presente en todas las pantallas */
.sponsor-bar { border-top: 1px solid var(--line); background: var(--bg); }
.sponsor-bar .wrap { display: flex; align-items: center; justify-content: center; gap: 10px; padding-block: 5px; font: 600 .66rem/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.pascalia-logo { height: 22px; width: auto; display: block; }
.by-pascalia { display: flex; align-items: center; justify-content: center; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); font: 600 .66rem/1 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kiosk .by-pascalia { border-top: 0; color: rgba(255,255,255,.6); }

/* Header */
.hero { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); background: linear-gradient(120deg, color-mix(in srgb, var(--primary) 20%, var(--bg)), var(--bg) 70%); }
.hero-bg { position: absolute; inset: 0; background-size: cover; background-position: center; }
.hero-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--bg) 92%, transparent) 0%, color-mix(in srgb, var(--bg) 55%, transparent) 100%); }
.hero .wrap { position: relative; display: flex; align-items: center; gap: 16px; padding-block: 22px; flex-wrap: wrap; }
.hero-logo { width: 76px; height: 76px; border-radius: 18px; object-fit: contain; background: color-mix(in srgb, var(--surface) 70%, transparent); padding: 6px; flex: none; }
.hero h1 { font-size: clamp(1.25rem, 3.6vw, 2.1rem); font-weight: 800; letter-spacing: -.01em; text-transform: uppercase; }
.hero .sub { color: var(--muted); font-size: .9rem; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font: 700 .68rem/1.4 var(--font-display); letter-spacing: .04em; text-transform: uppercase; background: color-mix(in srgb, var(--primary) 18%, transparent); color: var(--text); border: 1px solid color-mix(in srgb, var(--primary) 40%, transparent); }
.badge.neutral { background: var(--surface-2); border-color: var(--line); }
.badge.ok { background: color-mix(in srgb, var(--ok) 18%, transparent); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.badge.danger { background: color-mix(in srgb, var(--danger) 18%, transparent); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
.badge.live { background: var(--danger); color: #fff; border-color: var(--danger); }

main { padding-block: 20px 40px; }
.view-head { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.view-head h2 { font-size: 1.25rem; }
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 18px; padding-bottom: 2px; mask-image: linear-gradient(90deg, #000 94%, transparent); padding-right: 24px; }
.tabs::-webkit-scrollbar { display: none; }
.tabs .pill { flex: none; }

/* Cards & controls */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card h3 { font-size: 1rem; font-weight: 700; }
.card-head { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.card-head > div { min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 10px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: 700 .84rem/1.1 var(--font-display); cursor: pointer; text-align: center; max-width: 100%; }
.btn:hover { border-color: color-mix(in srgb, var(--primary) 60%, transparent); }
.btn:focus-visible, .pill:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .tile:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.danger { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--text); border-color: color-mix(in srgb, var(--danger) 50%, transparent); }
.btn.ghost { background: transparent; }
.btn.sm { padding: 7px 11px; font-size: .76rem; }
.btn.icon { padding: 8px; border-radius: 10px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
label.field { display: grid; gap: 5px; font-size: .78rem; font-weight: 600; color: var(--muted); min-width: 0; }
.input, select.input, textarea.input { width: 100%; min-width: 0; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: .92rem; }
textarea.input { resize: vertical; }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.switch:last-child { border-bottom: 0; }
.switch .lbl { min-width: 0; }
.switch .lbl b { display: block; font-size: .9rem; }
.switch .lbl span { font-size: .76rem; color: var(--muted); }
.toggle { appearance: none; width: 44px; height: 26px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; cursor: pointer; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s; }
.toggle:checked { background: var(--primary); border-color: var(--primary); }
.toggle:checked::after { transform: translateX(18px); background: var(--on-primary); }
input[type=color].input { padding: 3px; height: 40px; cursor: pointer; }
.upload { display: flex; align-items: center; gap: 12px; padding: 10px; border: 1px dashed color-mix(in srgb, var(--text) 25%, transparent); border-radius: var(--radius-sm); min-width: 0; }
.upload .thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: contain; background: var(--bg); flex: none; }
.upload .thumb.wide { width: 112px; object-fit: cover; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.note { padding: 10px 12px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--primary) 10%, transparent); border: 1px solid color-mix(in srgb, var(--primary) 30%, transparent); font-size: .82rem; }
.note.danger { background: color-mix(in srgb, var(--danger) 10%, transparent); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.note.ok { background: color-mix(in srgb, var(--ok) 10%, transparent); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
fieldset.card { min-width: 0; }
fieldset.card[disabled] { opacity: .6; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* Teams, players */
.crest { object-fit: contain; flex: none; display: block; }
.c20 { width: 22px; height: 22px; } .c28 { width: 30px; height: 30px; } .c40 { width: 42px; height: 42px; } .c56 { width: 58px; height: 58px; } .c80 { width: 84px; height: 84px; } .c120 { width: 120px; height: 120px; }
.avatar { border-radius: 50%; object-fit: cover; flex: none; background: var(--surface-2); }
.team-link { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; cursor: pointer; color: inherit; text-align: left; min-width: 0; font-weight: 600; }
.team-link:hover .tn { text-decoration: underline; text-decoration-color: var(--primary); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; justify-items: center; gap: 8px; text-align: center; cursor: pointer; color: inherit; min-width: 0; }
.tile:hover { border-color: var(--primary); }
.tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 118px), 1fr)); }
.player-card { background: var(--surface-2); border-radius: var(--radius); overflow: hidden; min-width: 0; display: grid; }
.player-card .ph { position: relative; aspect-ratio: 1; max-width: 100%; background: var(--bg); }
.player-card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.player-card .dorsal { position: absolute; left: 8px; top: 8px; font: 900 1.1rem/1 var(--font-display); background: var(--primary); color: var(--on-primary); padding: 5px 8px; border-radius: 8px; }
.player-card .body { padding: 10px; display: grid; gap: 4px; min-width: 0; }
.player-card .nm { font: 700 .88rem/1.2 var(--font-display); }
.statline { display: flex; flex-wrap: wrap; gap: 6px; font-size: .74rem; color: var(--muted); }
.statline span { display: inline-flex; align-items: center; gap: 3px; }
.cardchip { display: inline-block; width: 9px; height: 13px; border-radius: 2px; vertical-align: -2px; }
.cardchip.y { background: var(--c-yellow); } .cardchip.b { background: var(--c-blue); } .cardchip.r { background: var(--c-red); }

/* KPIs */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); margin-bottom: 20px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.kpi .k { font: 700 .7rem/1.2 var(--font-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.kpi .v { font: 800 2rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.kpi .who { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: .82rem; }
.kpi.feature { background: linear-gradient(140deg, color-mix(in srgb, var(--primary) 26%, var(--surface)), var(--surface)); }

/* Tables */
.table-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); }
table.t { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
.t th { font: 700 .7rem/1 var(--font-display); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 11px 6px; background: var(--surface-2); white-space: nowrap; }
.t th:nth-child(2) { text-align: left; }
.t td { padding: 8px 6px; text-align: center; border-top: 1px solid var(--line); white-space: nowrap; }
.t td:nth-child(2) { text-align: left; }
.t td.pts, .t th.pts { background: var(--hl); color: var(--hl-text); font-weight: 800; }
.t td.pos { font-weight: 800; position: relative; width: 38px; }
.t td.pos::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 4px; border-radius: 0 4px 4px 0; background: var(--zone, transparent); }
.t .tn { max-width: 11rem; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 12px; font-size: .74rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* Matches */
.match { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 10px; min-width: 0; }
.match-top { display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; align-items: center; font-size: .74rem; color: var(--muted); }
.vs { display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); gap: 8px; align-items: center; }
.vs .side { display: flex; align-items: center; gap: 8px; min-width: 0; }
.vs .side.away { flex-direction: row-reverse; text-align: right; }
.vs .score { font: 900 1.4rem/1 var(--font-display); font-variant-numeric: tabular-nums; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); white-space: nowrap; }
.vs .score.sched { font-size: .95rem; color: var(--muted); }
.round-title { font: 800 .9rem/1.2 var(--font-display); margin: 6px 0 2px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

/* Lists */
.lead-list { display: grid; gap: 6px; }
.lead-item { display: grid; grid-template-columns: 26px 40px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px; border-radius: 12px; background: var(--surface-2); }
.lead-item .rk { font: 800 .9rem/1 var(--font-display); color: var(--muted); text-align: center; }
.lead-item .val { font: 900 1.25rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.lead-item .nm { font-weight: 700; font-size: .86rem; }

/* Referee console */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; }
.team-panel { background: var(--surface-2); border-radius: var(--radius); padding: 14px; display: grid; gap: 10px; justify-items: center; text-align: center; min-width: 0; }
.team-panel .big { font: 900 3.4rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.act-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; width: 100%; }
.act-grid .btn { padding: 12px 8px; border-radius: 12px; }
.btn.y { background: var(--c-yellow); color: #1F1F1F; border-color: var(--c-yellow); }
.btn.b { background: var(--c-blue); color: #fff; border-color: var(--c-blue); }
.btn.r { background: var(--c-red); color: #fff; border-color: var(--c-red); }
.clock { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: var(--radius); background: var(--bg); border: 1px solid var(--line); }
.clock .time { font: 900 2.4rem/1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.timeline { display: grid; gap: 6px; }
.ev { display: grid; grid-template-columns: 44px 22px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.ev .min { font: 800 .9rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.ev .what { min-width: 0; font-size: .84rem; }
.ev .what b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .what span { color: var(--muted); font-size: .74rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev-ico { width: 22px; height: 22px; display: grid; place-items: center; }
.pick-grid { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 96px), 1fr)); }
.pick { border: 2px solid transparent; background: var(--surface-2); border-radius: 12px; padding: 8px 6px; display: grid; justify-items: center; gap: 4px; cursor: pointer; color: inherit; min-width: 0; text-align: center; }
.pick.on { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 16%, var(--surface-2)); }
.pick[disabled] { opacity: .4; cursor: not-allowed; }
.pick .n { font: 900 .9rem/1 var(--font-display); }
.pick .pn { font-size: .7rem; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sigpad { width: 100%; height: 150px; border-radius: 12px; background: #fff; touch-action: none; cursor: crosshair; display: block; border: 2px dashed color-mix(in srgb, var(--text) 25%, transparent); }

/* Flyer studio */
.studio { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 900px) { .studio { grid-template-columns: minmax(0, 340px) minmax(0, 1fr); } }
.flyer-preview { background: var(--bg); border-radius: var(--radius); padding: 12px; display: grid; place-items: center; border: 1px solid var(--line); }
.flyer-preview canvas { width: 100%; max-width: 460px; height: auto; border-radius: 10px; box-shadow: 0 12px 40px rgba(0,0,0,.35); display: block; }
.sponsor-slots { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); }

/* Social */
.post { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.post .media { aspect-ratio: 16/9; max-width: 100%; background: linear-gradient(135deg, color-mix(in srgb, var(--primary) 30%, var(--bg)), var(--bg)); display: grid; place-items: center; color: var(--muted); }
.post .media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.post .pb { padding: 12px 14px; display: grid; gap: 8px; }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }
.modal[hidden] { display: none; }
.sheet { background: var(--surface); width: 100%; max-width: 760px; max-height: 92dvh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; border: 1px solid var(--line); }

function buildSeed() {
  const rnd = mulberry32(20261025);
  const pickW = (arr, w) => { const tot = w.reduce((a, b) => a + b, 0); let r = rnd() * tot; for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r <= 0) return arr[i]; } return arr[arr.length - 1]; };
  const teams = [], players = [];
  SEED_TABLE.forEach((row, i) => {
    const [name, pj, pg, pe, pp, gf, gc, c1, c2] = row;
    const id = 'T' + (i + 1);
    teams.push({ id, name, color: c1, color2: c2, crest: makeCrest(name, c1, c2), logo: LOGOS[TEAM_LOGO_KEY[name]] || null, logoPending: null, delegate: `DT ${name}`, phone: '', base: { pj, pg, pe, pp, gf, gc }, finesPaid: 0 });
    const roster = POS.map(([pos, num], k) => {
      const nm = `${FIRST[Math.floor(rnd() * FIRST.length)]} ${LAST[Math.floor(rnd() * LAST.length)]}`;
      return { id: `${id}P${k + 1}`, teamId: id, name: nm, number: num, pos, doc: String(1090400000 + Math.floor(rnd() * 899999)), photo: makeAvatar(nm, c1, num), status: 'APPROVED', base: { goals: 0, assists: 0, yellow: 0, blue: 0, red: 0 } };
    });
    const w = roster.map((p) => ({ POR: 0, DEF: 1, MED: 2.2, DEL: 4.5 })[p.pos]);
    for (let g = 0; g < gf; g++) { const s = pickW(roster, w); s.base.goals++; if (rnd() < 0.6) { const others = roster.filter((p) => p !== s && p.pos !== 'POR'); others[Math.floor(rnd() * others.length)].base.assists++; } }
    for (let c = 0; c < pj; c++) { if (rnd() < 0.85) roster[1 + Math.floor(rnd() * 9)].base.yellow++; if (rnd() < 0.3) roster[1 + Math.floor(rnd() * 9)].base.blue++; }
    players.push(...roster);
  });

const team = (id) => state.teams.find((t) => t.id === id);
const player = (id) => state.players.find((p) => p.id === id);

function matchScore(m) {
  if (m.override) return { h: m.override.h, a: m.override.a };
  if (m.status === 'WO' && m.wo) return { h: m.wo.h, a: m.wo.a };
  let h = 0, a = 0;
  m.events.forEach((e) => { if (e.type === 'GOAL') { if (e.teamId === m.homeId) h++; else a++; } });
  return { h, a };
}
const isPlayed = (m) => m.status === 'LOCKED' || m.status === 'WO';
const isLive = (m) => m.status === 'IN_PROGRESS';

function playerStats(p) {
  const s = { ...p.base };
  state.matches.forEach((m) => {
    if (m.status === 'SCHEDULED') return;
    m.events.forEach((e) => {
      if (e.type === 'GOAL' && e.kind !== 'Autogol' && e.playerId === p.id) s.goals++;
      if (e.type === 'GOAL' && e.assistId === p.id) s.assists++;
      if (e.playerId === p.id) { if (e.type === 'YELLOW') s.yellow++; if (e.type === 'BLUE') s.blue++; if (e.type === 'RED') s.red++; }
    });
  });
  return s;
}
function isSuspended(p, forMatch) {
  // Roja: queda suspendido los próximos N partidos de su equipo (regla configurable).
  const teamMatches = state.matches.filter((m) => (m.homeId === p.teamId || m.awayId === p.teamId)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const idx = forMatch ? teamMatches.findIndex((m) => m.id === forMatch.id) : teamMatches.length;
  for (let i = Math.max(0, idx - R().redSuspension); i < idx; i++) {
    if (teamMatches[i].events.some((e) => e.type === 'RED' && e.playerId === p.id)) return 'Roja en partido anterior';
  }
  if (p.base.red && !teamMatches.slice(0, idx).some((m) => isPlayed(m) || isLive(m))) return 'Roja en la fecha anterior';
  return false;
}
function teamFair(tid) { return state.players.filter((p) => p.teamId === tid).reduce((acc, p) => { const s = playerStats(p); return acc + s.yellow + s.blue * 2 + s.red * 3; }, 0); }
function teamCards(tid) { return state.players.filter((p) => p.teamId === tid).reduce((acc, p) => { const s = playerStats(p); acc.y += s.yellow; acc.b += s.blue; acc.r += s.red; return acc; }, { y: 0, b: 0, r: 0 }); }
function teamFinesDue(tid) { const F = state.settings.fines; if (!F.enabled) return 0; const c = teamCards(tid); return c.y * F.yellow + c.b * F.blue + c.r * F.red - (team(tid).finesPaid || 0); }

function standings() {
  const rows = state.teams.map((t) => ({ t, pj: t.base.pj, pg: t.base.pg, pe: t.base.pe, pp: t.base.pp, gf: t.base.gf, gc: t.base.gc }));
  const byId = Object.fromEntries(rows.map((r) => [r.t.id, r]));
  state.matches.filter(isPlayed).forEach((m) => {
    const { h, a } = matchScore(m); const H = byId[m.homeId], A = byId[m.awayId]; if (!H || !A) return;
    H.pj++; A.pj++; H.gf += h; H.gc += a; A.gf += a; A.gc += h;
    if (h > a) { H.pg++; A.pp++; } else if (h < a) { A.pg++; H.pp++; } else { H.pe++; A.pe++; }
  });
  rows.forEach((r) => { r.dg = r.gf - r.gc; r.pts = r.pg * R().ptsWin + r.pe * R().ptsDraw + r.pp * R().ptsLoss; r.fair = teamFair(r.t.id); });
  const order = R().tiebreak;
  rows.sort((a, b) => {
    for (const k of order) { const d = (k === 'gc' || k === 'fair') ? a[k] - b[k] : b[k] - a[k]; if (d) return d; }
    return a.t.name.localeCompare(b.t.name);
  });
  rows.forEach((r, i) => { r.pos = i + 1; });
  return rows;
}
function zoneOf(pos, n) {
  const Z = state.settings.zones;
  if (pos <= Z.qualify) return 'var(--zone-1)';
  if (pos <= Z.qualify + Z.playoff) return 'var(--zone-2)';
  if (Z.relegate && pos > n - Z.relegate) return 'var(--zone-3)';
  return 'transparent';
}
function leaders() {
  const ps = state.players.filter((p) => p.status === 'APPROVED').map((p) => ({ p, s: playerStats(p) }));
  const scorers = ps.filter((x) => x.s.goals).sort((a, b) => b.s.goals - a.s.goals || b.s.assists - a.s.assists);
  const assists = ps.filter((x) => x.s.assists).sort((a, b) => b.s.assists - a.s.assists || b.s.goals - a.s.goals);
  const st = standings().filter((r) => r.pj > 0);
  const valla = [...st].sort((a, b) => (a.gc / a.pj) - (b.gc / b.pj) || a.gc - b.gc || b.pj - a.pj);
  const tot = ps.reduce((acc, x) => { acc.y += x.s.yellow; acc.b += x.s.blue; acc.r += x.s.red; return acc; }, { y: 0, b: 0, r: 0 });
  const goals = standings().reduce((a, r) => a + r.gf, 0);
  const played = standings().reduce((a, r) => a + r.pj, 0) / 2;
  return { scorers, assists, valla, tot, goals, played };
}

// ---------- Descargas (PDF / PNG / XLSX) ----------
async function saveFile(filename, blob) {
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const d = await window.claude.use('downloads');
      if (d) { await d.save({ filename, data: blob }); toast('Listo: ' + filename); return; }
    }
  } catch (e) {
    if (e && e.code === 'declined') { toast('Descarga cancelada'); return; }
    if (e && e.code === 'rate_limited') { toast('Espera un momento y vuelve a intentar'); return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Descargado: ' + filename);
}
const canvasBlob = (c) => new Promise((res) => c.toBlob(res, 'image/png'));
const slug = (s) => norm(s).toLowerCase().replace(/ /g, '-');
const libsMissing = (k) => { if (k === 'pdf' && !(window.jspdf && window.jspdf.jsPDF)) { toast('No cargó el generador de PDF. Revisa tu conexión y recarga.'); return true; } if (k === 'xlsx' && !window.XLSX) { toast('No cargó el lector de Excel. Revisa tu conexión y recarga.'); return true; } return false; };

async function sha256(text) {
  try { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)); return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 0; for (let i = 0; i < text.length; i++) h = (h * 31 + text.charCodeAt(i)) | 0; return 'fallback-' + (h >>> 0).toString(16); }
}

// Imagen → dataURL con tamaño acotado (conserva transparencia en PNG).
function readImage(file, max = 600) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) { reject(new Error('Formato no válido')); return; }
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = canvasOf(Math.max(1, Math.round(img.width * s)), Math.max(1, Math.round(img.height * s)));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(file.type === 'image/jpeg' ? c.toDataURL('image/jpeg', 0.88) : c.toDataURL('image/png'));
      };
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
const imgCache = new Map();
function loadImg(src) {
  if (!src) return Promise.resolve(null);
  if (imgCache.has(src)) return imgCache.get(src);
  const p = new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  imgCache.set(src, p); return p;
}

function clockMs(m) { const c = m.clock; return c.acc + (c.running ? Date.now() - c.startTs : 0); }
function clockText(m) {
  const ms = clockMs(m), per = R().periodMin * 60000;

  const mm = Math.floor(v / 60000), ss = Math.floor((v % 60000) / 1000);
  return `${String(mm).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
}
const currentMinute = (m) => Math.min(R().periodMin + 15, Math.floor(clockMs(m) / 60000) + 1) + (m.clock.period - 1) * R().periodMin;
function periodFouls(m, tid) { return m.events.filter((e) => e.type === 'FOUL' && e.teamId === tid && (!R().foulsResetPerPeriod || e.period === m.clock.period)).length; }

function readDraftFields() {

const SAMPLE_ROWS = [[1, 'UNION FOX', 2, 1, 1, 0, 7, 4, 3, 4], [2, 'SPARTANS', 2, 1, 1, 0, 6, 3, 3, 4], [3, 'AGROPECUARIOS', 2, 1, 1, 0, 5, 2, 3, 4], [4, 'LA ESTANCIA', 2, 1, 1, 0, 2, 1, 1, 4], [5, 'LOS PRIMOS', 1, 1, 0, 0, 2, 1, 1, 3], [6, 'COMBO GUILLIN', 1, 1, 0, 0, 2, 1, 1, 3], [7, 'EL HOYO', 1, 1, 0, 0, 1, 0, 1, 3], [8, 'COMBO CRIS', 2, 1, 0, 1, 5, 5, 0, 3], [9, 'GALACTICOS', 2, 1, 0, 1, 4, 6, -2, 3], [10, 'COMBO NANDO', 2, 0, 2, 0, 3, 3, 0, 2], [11, 'BARRIO', 1, 0, 1, 0, 2, 2, 0, 1], [12, 'FENIX', 2, 0, 1, 1, 2, 3, -1, 1], [13, 'GOAT', 1, 0, 0, 1, 1, 2, -1, 0], [14, 'COMBO SAEL', 1, 0, 0, 1, 0, 1, -1, 0], [15, 'COMBO CHICLE', 2, 0, 0, 2, 5, 9, -4, 0], [16, 'SANCHEZ', 2, 0, 0, 2, 2, 6, -4, 0]];
function rowsFromMatrix(mx) {
  const hi = mx.findIndex((r) => r.some((c) => norm(c) === 'EQUIPO'));
  if (hi < 0) return { error: 'No encontré la fila de encabezados. La hoja debe tener las columnas POS, EQUIPO, PJ, PG, PE, PP, GF, GC, DG y PTS.' };
  const head = mx[hi].map((c) => norm(c));
  const idx = Object.fromEntries(IMPORT_COLS.map((c) => [c, head.indexOf(c)]));
  const missing = IMPORT_COLS.filter((c) => idx[c] < 0 && c !== 'POS');
  if (missing.length) return { error: 'Faltan columnas: ' + missing.join(', ') };
  const rows = mx.slice(hi + 1).filter((r) => r[idx.EQUIPO] != null && String(r[idx.EQUIPO]).trim()).map((r) => {
    const o = { equipo: String(r[idx.EQUIPO]).trim() };
    IMPORT_COLS.filter((c) => c !== 'EQUIPO').forEach((c) => { o[c.toLowerCase()] = idx[c] >= 0 ? parseInt(r[idx[c]], 10) : NaN; });
    return o;
  });
  return { rows };
}
function validateRow(o) {
  const errs = [];
  ['pj', 'pg', 'pe', 'pp', 'gf', 'gc'].forEach((k) => { if (!Number.isInteger(o[k]) || o[k] < 0) errs.push(`${k.toUpperCase()} no es un entero válido`); });
  if (!errs.length) {
    if (o.pj !== o.pg + o.pe + o.pp) errs.push(`PJ (${o.pj}) ≠ PG+PE+PP (${o.pg + o.pe + o.pp})`);
    if (Number.isInteger(o.dg) && o.dg !== o.gf - o.gc) errs.push(`DG (${o.dg}) ≠ GF−GC (${o.gf - o.gc})`);
    const pts = o.pg * R().ptsWin + o.pe * R().ptsDraw + o.pp * R().ptsLoss;
    if (Number.isInteger(o.pts) && o.pts !== pts) errs.push(`PTS (${o.pts}) ≠ ${pts} según las reglas`);
  }
  return errs;
}

  finePay: (d) => { const t = team(d.id); t.finesPaid = (t.finesPaid || 0) + teamFinesDue(t.id); render(); toast(`${t.name} queda a paz y salvo`); },
  assignDay: (d) => { const g = $('#day-' + d.id).value; const ms = state.matches.filter((m) => m.date === d.id && m.status !== 'LOCKED'); ms.forEach((m) => { m.refGroupId = g || null; }); render(); toast(g ? `${group(g).name} asignado a ${ms.length} partidos del ${fmtDateLong(d.id)}` : 'Árbitros retirados de la jornada'); },
  groupCreate: () => {
    const name = $('#gName').value.trim() || `Grupo ${String.fromCharCode(65 + state.refGroups.length)}`;
    const mem = [['gC', 'Central'], ['gA1', 'Asistente 1'], ['gA2', 'Asistente 2'], ['gP', 'Planillero']].map(([id, role]) => ({ userId: $('#' + id).value, role })).filter((x) => x.userId);
    if (!mem.some((x) => x.role === 'Central')) { toast('El grupo necesita un árbitro central'); return; }
    state.refGroups.push({ id: uid('G'), name, members: mem }); render(); toast(`${name} creado`);
  },
  groupDelete: (d) => { if (state.matches.some((m) => m.refGroupId === d.id && m.status !== 'SCHEDULED')) { toast('Ese grupo ya dirigió partidos: no se puede borrar'); return; } state.matches.forEach((m) => { if (m.refGroupId === d.id) m.refGroupId = null; }); state.refGroups = state.refGroups.filter((g) => g.id !== d.id); render(); },
  matchCreate: () => {
    const h = $('#nmHome').value, a = $('#nmAway').value; if (h === a) { toast('Elige dos equipos distintos'); return; }
    state.matches.push({ id: uid('M'), round: parseInt($('#nmRound').value, 10) || 1, date: $('#nmDate').value, time: $('#nmTime').value, field: $('#nmField').value || 'Cancha', homeId: h, awayId: a, status: 'SCHEDULED', refGroupId: null, events: [], added: [0, 0], clock: { period: 1, running: false, startTs: 0, acc: 0 }, signature: null, signedAt: null, hash: null, version: '—', clarification: null, override: null, wo: null });
    render(); toast('Partido programado');
  },
  woOpen: (d) => { const m = getMatch(d.id); openModal(`<div class="sheet-head"><h3>Declarar W.O.</h3><button class="btn icon ghost" data-act="closeModal" aria-label="Cerrar">${ic('x')}</button></div><p class="small muted">¿Qué equipo se presentó? Gana ${R().woGoals}-0.</p><div class="btns"><button class="btn" data-act="woGo" data-id="${m.id}" data-w="h">${esc(team(m.homeId).name)}</button><button class="btn" data-act="woGo" data-id="${m.id}" data-w="a">${esc(team(m.awayId).name)}</button></div>`); },
  woGo: (d) => { const m = getMatch(d.id), g = R().woGoals; m.status = 'WO'; m.wo = d.w === 'h' ? { h: g, a: 0 } : { h: 0, a: g }; closeModal(); render(); toast('W.O. registrado en la tabla'); },
  userCreate: (d) => {
    const name = $('#nuName').value.trim(), user = $('#nuUser').value.trim(), role = $('#nuRole').value;
    if (!name || !user) { toast('Escribe el nombre y el usuario'); return; }
    if (state.users.some((u) => u.user.toLowerCase() === user.toLowerCase())) { toast('Ese usuario ya existe'); return; }
    const u = { id: uid('U'), name, user, role, phone: $('#nuPhone').value.trim(), active: true };
    if (role === 'TEAM_DIR') u.teamId = $('#nuTeam').value; if (role === 'REFEREE') u.refRole = $('#nuRef').value;
    state.users.push(u); render(); showPassword(u);
  },
  userReset: (d) => showPassword(userById(d.id)),
  userDelete: (d) => { const u = userById(d.id); if (state.refGroups.some((g) => g.members.some((x) => x.userId === u.id))) { toast('Está en un grupo arbitral: desactívalo en lugar de borrarlo'); return; } state.users = state.users.filter((x) => x.id !== d.id); render(); toast('Usuario eliminado'); },
  tbMove: (d) => { const t = R().tiebreak, i = +d.id, j = i + +d.dir; [t[i], t[j]] = [t[j], t[i]]; render(); },
  tbRemove: (d) => { R().tiebreak.splice(+d.id, 1); render(); },
  tbAdd: (d) => { R().tiebreak.push(d.id); render(); },
  formatSet: (d) => { R().format = d.id; render(); toast('Formato activado'); },
  attemptEdit: () => toast('Acceso denegado: los resultados firmados solo cambian con acta aclaratoria.'),

  // Importador
  importSample: () => { setImportRows(SAMPLE_ROWS.map((r) => Object.fromEntries(['pos', 'equipo', 'pj', 'pg', 'pe', 'pp', 'gf', 'gc', 'dg', 'pts'].map((k, i) => [k, r[i]]))), null); },
  importPaste: () => { const txt = $('#pasteBox').value.trim(); if (!txt) { toast('Pega primero las celdas copiadas'); return; } const mx = txt.split(/\r?\n/).map((l) => l.split(/\t|;|,(?=\S)/)); const r = rowsFromMatrix(mx); if (r.error) { toast(r.error); return; } setImportRows(r.rows, null); },
  importCancel: () => { state.ui.importRows = null; state.ui.importPlayers = null; render(); },
  importTemplate: () => {
    if (libsMissing('xlsx')) return;
    const wb = XLSX.utils.book_new();
    const st = standings();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([IMPORT_COLS, ...st.map((r) => [r.pos, r.t.name.toUpperCase(), r.pj, r.pg, r.pe, r.pp, r.gf, r.gc, r.dg, r.pts])]), 'TABLA');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['EQUIPO', 'NOMBRE', 'DORSAL', 'POSICION', 'DOCUMENTO', 'GOLES', 'ASISTENCIAS', 'AMARILLAS', 'ROJAS'], ...state.players.filter((p) => p.status === 'APPROVED').map((p) => { const s = playerStats(p); return [team(p.teamId).name.toUpperCase(), p.name, p.number, p.pos, p.doc, s.goals, s.assists, s.yellow, s.red]; })]), 'JUGADORES');
    saveFile('plantilla-campeonato.xlsx', new Blob([XLSX.write(wb, { bookType: 'xlsx', type: 'array' })], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  },
  importApply: () => {
    const rows = state.ui.importRows; let created = 0;
    const touched = new Set();
    rows.forEach((r, i) => {
      let t = findTeamByName(r.equipo);
      if (!t) {
        const pal = ['#455A64', '#6A1B9A', '#00695C', '#C62828', '#283593', '#EF6C00'], c1 = pal[i % pal.length];
        const nm = r.equipo.toLowerCase().replace(/\b\p{L}/gu, (c) => c.toUpperCase());
        t = { id: uid('T'), name: nm, color: c1, color2: '#FFFFFF', crest: makeCrest(nm, '#78909C', '#ECEFF1'), logo: null, logoPending: null, delegate: 'Por asignar', phone: '', base: {}, finesPaid: 0 };
        state.teams.push(t); created++;
      }
      // La tabla importada es la base; los partidos que se firmen en la app se suman encima.
      t.base = { pj: r.pj, pg: r.pg, pe: r.pe, pp: r.pp, gf: r.gf, gc: r.gc };
      touched.add(t.id);
    });
    let pc = 0;
    if (state.ui.importPlayers) {
      state.ui.importPlayers.forEach((r) => {
        const t = findTeamByName(r.equipo); if (!t) return;
        let p = state.players.find((x) => x.teamId === t.id && (norm(x.name) === norm(r.nombre) || x.number === r.dorsal));
        if (!p) { p = { id: uid('P'), teamId: t.id, name: r.nombre, number: r.dorsal || 0, pos: ['POR', 'DEF', 'MED', 'DEL'].includes(norm(r.posicion).slice(0, 3)) ? norm(r.posicion).slice(0, 3) : 'MED', doc: String(r.documento || ''), photo: makeAvatar(r.nombre, t.color, r.dorsal || 0), status: 'APPROVED', base: {} }; state.players.push(p); }
        p.base = { goals: r.goles || 0, assists: r.asistencias || 0, yellow: r.amarillas || 0, blue: 0, red: r.rojas || 0 }; pc++;
      });
    }
    state.ui.importRows = null; state.ui.importPlayers = null; render();
    toast(`Importados ${rows.length} equipos${created ? ` (${created} nuevos con escudo genérico)` : ''}${pc ? ` y ${pc} jugadores` : ''}. La tabla se recalculó.`);
  }
};
function setImportRows(rows, players) {
  state.ui.importRows = rows.map((r) => ({ ...r, errs: validateRow(r) }));
  state.ui.importPlayers = players; render();
  toast(`${rows.length} filas leídas. Revisa la vista previa.`);
}
function showPassword(u) {
  const pw = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => 'abcdefghjkmnpqrstuvwxyz23456789'[b % 31]).join('');
  openModal(`<div class="sheet-head"><div><span class="eyebrow">${ROLE_NAMES[u.role]}</span><h3>Credenciales de ${esc(u.name)}</h3></div><button class="btn icon ghost" data-act="closeModal" aria-label="Cerrar">${ic('x')}</button></div>
    <div class="note"><p>Usuario: <b>${esc(u.user)}</b></p><p>Clave temporal: <b class="num" id="pwText">${pw}</b></p></div>
    <p class="small muted">Compártela por un canal privado. Al primer ingreso se le pedirá cambiarla. En producción se envía por correo o WhatsApp.</p>
    <div class="btns"><button class="btn primary" data-act="copyPw">Copiar</button><button class="btn" data-act="closeModal">Listo</button></div>`);
}
ACT.copyPw = () => { const t = `${$('#pwText').textContent}`; navigator.clipboard?.writeText(t).then(() => toast('Clave copiada'), () => { const r = document.createRange(); r.selectNodeContents($('#pwText')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Selecciónala y cópiala'); }); };

const CHANGE = {
  refUser: (v) => { state.ui.refUser = v; state.ui.refMatch = null; render(); },
  refMatch: (v) => { state.ui.refMatch = v; render(); },
  dtTeam: (v) => { state.ui.dtTeam = v; state.ui.npPhoto = null; render(); },
  assignMatch: (v, d) => { getMatch(d.id).refGroupId = v || null; render(); toast(v ? `${group(v).name} asignado` : 'Partido sin árbitros'); },
  added: (v, d) => { getMatch(d.id).added[+d.i] = Math.max(0, parseInt(v, 10) || 0); save(); },
  modality: (v) => { Object.assign(state.rules, clone(MODALITIES[v]), { modality: v }); delete state.rules.label; render(); toast(`Reglas de ${MODALITIES[v].label} precargadas. Ajusta las que necesites.`); },
  userActive: (v, d, el) => { userById(d.id).active = el.checked; render(); toast(el.checked ? 'Usuario activado' : 'Usuario desactivado'); },
  userFilter: (v) => { state.ui.userFilter = v; render(); },
  nuRole: (v) => { state.ui.nuRole = v; const keep = { n: $('#nuName').value, u: $('#nuUser').value, p: $('#nuPhone').value }; render(); $('#nuName').value = keep.n; $('#nuUser').value = keep.u; $('#nuPhone').value = keep.p; },
  teamCount: (v) => { state.ui.teamCount = +v; render(); }
};

// Archivos subidos (logos, banner, fotos, Excel)
async function handleUpload(el) {
  const f = el.files[0]; if (!f) return;
  const key = el.dataset.upload, S = state.settings;
  if (key === 'excel') { await readExcel(f); return; }
  let data;
  try { data = await readImage(f, ['banner', 'flyerBg'].includes(key) ? 1600 : key === 'playerPhoto' || key === 'newPlayer' ? 360 : 600); } catch (e) { toast(e.message + '. Usa PNG o JPG.'); return; }
  imgCache.delete(data);
  if (key === 'logo' || key === 'banner' || key === 'flyerBg') { S[key] = data; toast('Imagen actualizada'); }
  else if (key === 'sponsorMain') { S.sponsors.main = { name: S.sponsors.main?.name || f.name.replace(/\.\w+$/, ''), logo: data }; toast('Patrocinador principal actualizado'); }
  else if (key.startsWith('sponsor')) { const i = +key.slice(7); S.sponsors.secondary[i] = { name: S.sponsors.secondary[i]?.name || f.name.replace(/\.\w+$/, ''), logo: data }; toast(`Patrocinador secundario ${i + 1} actualizado`); }
  else if (key === 'teamLogo') { const t = team(el.dataset.id); if (S.logoApproval) { t.logoPending = data; toast('Escudo enviado al Admin para aprobación'); } else { t.logo = data; toast('Escudo publicado'); } }
  else if (key === 'playerPhoto') { player(el.dataset.id).photo = data; toast('Foto actualizada'); }
  else if (key === 'newPlayer') { state.ui.npPhoto = data; const keep = { n: $('#npName').value, u: $('#npNumber').value, d: $('#npDoc').value, p: $('#npPos').value }; render(); $('#npName').value = keep.n; $('#npNumber').value = keep.u; $('#npDoc').value = keep.d; $('#npPos').value = keep.p; return; }
  render();
}
async function readExcel(f) {
  try {
    let mx, pl = null;
    if (/\.csv$/i.test(f.name)) { const txt = await f.text(); mx = txt.split(/\r?\n/).filter(Boolean).map((l) => l.split(/;|,|\t/)); }
    else {
      if (libsMissing('xlsx')) return;
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      const sheetName = wb.SheetNames.find((n) => norm(n) !== 'JUGADORES') || wb.SheetNames[0];
      mx = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: true });
      const js = wb.SheetNames.find((n) => norm(n) === 'JUGADORES');
      if (js) pl = XLSX.utils.sheet_to_json(wb.Sheets[js], { defval: '' }).map((r) => { const o = {}; Object.entries(r).forEach(([k, v]) => { o[norm(k).toLowerCase()] = typeof v === 'number' ? v : String(v).trim(); }); ['dorsal', 'goles', 'asistencias', 'amarillas', 'rojas'].forEach((k) => { o[k] = parseInt(o[k], 10) || 0; }); return o; }).filter((o) => o.equipo && o.nombre);
    }
    const r = rowsFromMatrix(mx); if (r.error) { toast(r.error); return; }
    setImportRows(r.rows, pl);
  } catch (e) { toast('No pude leer el archivo. Verifica que sea .xlsx o .csv.'); }
}

// Tablero de cancha a pantalla completa
function renderKiosk() {
  const m = getMatch(state.ui.kiosk); if (!m) return; const H = team(m.homeId), A = team(m.awayId), s = matchScore(m);
  $('#kiosk').innerHTML = `<div class="row between"><span class="row" style="font:800 1.1rem var(--font-display)">${state.settings.logo ? `<img src="${state.settings.logo}" width="44" height="44" style="object-fit:contain" alt="">` : ''}${esc(state.settings.title)}</span><button class="btn" data-act="kioskClose">${ic('x')} Salir</button></div>
    <div style="display:grid;align-content:center;gap:4vh"><div class="k-clock" id="kioskClock">${clockText(m)}</div><div class="k-score"><div class="k-team"><img src="${teamLogo(H)}" alt=""><b>${esc(H.name)}</b></div><div class="k-goals">${s.h}<span style="opacity:.4"> : </span>${s.a}</div><div class="k-team"><img src="${teamLogo(A)}" alt=""><b>${esc(A.name)}</b></div></div></div>
    <div style="display:grid;gap:8px"><div style="text-align:center;opacity:.7">Tiempo ${m.clock.period} de ${R().periods} · ${esc(L().round)} ${m.round}</div>${byPascalia(true)}</div>`;
}

// ---------- Eventos globales ----------
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn({ ...el.dataset }, el, e); }
});
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('#kiosk').hidden) ACT.kioskClose(); else if (!$('#modal').hidden) closeModal(); } });
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.matches('input[data-upload]')) { handleUpload(el).finally(() => { el.value = ''; }); return; }
  if (el.dataset.actChange && CHANGE[el.dataset.actChange]) { CHANGE[el.dataset.actChange](el.value, { ...el.dataset }, el); return; }
  if (el.dataset.flyer) { const k = el.dataset.flyer; state.settings.flyer[k] = el.type === 'checkbox' ? el.checked : el.value; save(); refreshFlyer(); return; }
  if (el.dataset.bind) { applyBind(el); render(); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.bind && el.type !== 'checkbox' && el.tagName !== 'SELECT') { applyBind(el); applyTheme(); renderHero(); save(); }
});
function applyBind(el) {
  const p = el.dataset.bind;
  let v = el.type === 'checkbox' ? el.checked : (el.type === 'number' || el.type === 'range') ? (el.value === '' ? 0 : Number(el.value)) : el.value;
  if (p.startsWith('settings.colors.')) state.settings.preset = 'custom';
  if (p === 'rules.periods') { v = Math.max(1, Math.min(4, v)); }
  setPath(p, v);
}
function afterRender() {
  $$('#roleRail .pill.on, .tabs .pill.on').forEach((el) => { const r = el.parentElement; r.scrollLeft = el.offsetLeft - r.offsetLeft - 8; });
  if ($('#sigpad')) initSig('sigpad');
  if ($('#flyerCanvas')) refreshFlyer();
  const dz = $('#dropZone');
  if (dz) {
    dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('over'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('over'));
    dz.addEventListener('drop', (e) => { e.preventDefault(); dz.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) readExcel(f); });
  }
}
setInterval(() => {
  if (!state) return;
  if (state.ui.role === 'REFEREE') { const m = currentRefMatch(); const el = $('#clockText'); if (m && el && m.status === 'IN_PROGRESS') el.textContent = clockText(m); }
  if (state.ui.kiosk) { const m = getMatch(state.ui.kiosk); const el = $('#kioskClock'); if (m && el) el.textContent = clockText(m); }
}, 500);

// ---------- Arranque ----------
(async function start() {
  try { await Promise.race([Promise.all([document.fonts.load('900 40px Montserrat'), document.fonts.load('400 16px Inter')]), new Promise((r) => setTimeout(r, 1500))]); } catch (e) { /* fuentes de respaldo */ }
  state = load() || buildSeed();
  render();
})();
</script>
